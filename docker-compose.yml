name: blockchain-based-student-project-ownership-registry

services:
  # ==============================================================================
  # Database Service (PostgreSQL)
  # ==============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: registry_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-registry_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-registry_password_dev}
      POSTGRES_DB: ${POSTGRES_DB:-project_registry_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-registry_user} -d ${POSTGRES_DB:-project_registry_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - registry_network

  # ==============================================================================
  # Backend API Service (FastAPI)
  # ==============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: registry_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      API_PREFIX: ${API_PREFIX:-/api/v1}
      DATABASE_URL: postgresql://${POSTGRES_USER:-registry_user}:${POSTGRES_PASSWORD:-registry_password_dev}@postgres:5432/${POSTGRES_DB:-project_registry_db}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    networks:
      - registry_network

  # ==============================================================================
  # Frontend Service (React + Vite)
  # ==============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: registry_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - registry_network

volumes:
  postgres_data:
    name: registry_postgres_data

networks:
  registry_network:
    name: registry_network
    driver: bridge
